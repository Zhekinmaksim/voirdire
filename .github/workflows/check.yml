name: Offline checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: make -C chain-and-site test
      - run: npm test
      - name: Reproduce fresh v3 confirmation from published data
        run: |
          gzip -dc chain-and-site/calibration/data/openrouter-groq-merged.jsonl.gz > /tmp/voirdire-old.jsonl
          python3 chain-and-site/scripts/round_confirmation_gate.py --release chain-and-site/calibration/candidates/int-v3 --run-dir chain-and-site/calibration/confirmation-v3 --old-source /tmp/voirdire-old.jsonl --out /tmp/voirdire-v3-audit.json
          python3 -c 'import json; assert json.load(open("/tmp/voirdire-v3-audit.json")) == json.load(open("chain-and-site/calibration/confirmation-v3/gate.json"))'
      - run: python3 scripts/package_contract.py
      - run: git diff --exit-code -- public/voirdire.py public/voirdire.deploy.py public/voirdire.deploy.map.json
      - run: npm run build
      # Regenerate fixtures after building, so a committed live matrix is not overwritten before its gate.
      - run: make -C chain-and-site fixture matrix page
      - name: Fixture must be undecidable
        shell: bash
        run: |
          set +e
          python3 chain-and-site/scripts/check_matrix.py chain-and-site/web/matrix.json > /tmp/gate.txt
          result=$?
          set -e
          cat /tmp/gate.txt
          test "$result" -eq 2
          grep -q '^UNDECIDABLE$' /tmp/gate.txt
      - name: Measured publication must reject fixture
        run: |
          if SITE_MODE=measured python3 scripts/build_site.py; then
            echo 'Fixture unexpectedly accepted as measured'
            exit 1
          fi
          test ! -d dist
