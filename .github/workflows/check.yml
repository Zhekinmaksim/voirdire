name: Offline checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: make -C chain-and-site test
      - run: python3 scripts/build_site.py
      # Regenerate fixtures after building, so a committed live matrix is not overwritten before its gate.
      - run: make -C chain-and-site fixture matrix page
      - name: Fixture must be undecidable
        shell: bash
        run: |
          set +e
          python3 chain-and-site/scripts/check_matrix.py chain-and-site/web/matrix.json > /tmp/gate.txt
          result=$?
          set -e
          cat /tmp/gate.txt
          test "$result" -eq 2
          grep -q '^UNDECIDABLE$' /tmp/gate.txt
      - name: Measured publication must reject fixture
        run: |
          if SITE_MODE=measured python3 scripts/build_site.py; then
            echo 'Fixture unexpectedly accepted as measured'
            exit 1
          fi
          test ! -d dist
